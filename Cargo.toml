[package]
name = "rpdd"
version = "0.1.0"
edition = "2021"
description = "Reproduces the deals of Richard Pavlicek's solved-deal library from their index"
repository = "https://github.com/bridge-craftwork/rpdd"
license = "Unlicense"
keywords = ["bridge", "cards", "deal"]
categories = ["games"]
exclude = ["/docs", "/scripts", "/.github"]

# No runtime dependencies, deliberately. An index goes in and thirteen bytes
# come out; anything else would be someone else's opinion travelling with it.
[dependencies]

[dev-dependencies]
serde_json = "1"
sha2 = "0.10"
hex = "0.4"

[package]
name = "rpdd-reader"
version = "0.1.0"
edition = "2021"
description = "Reads Richard Pavlicek's public library of 10,485,760 solved bridge deals: deals by index, with their double-dummy tables"
repository = "https://github.com/bridge-craftwork/rpdd-reader"
license = "Unlicense"
keywords = ["bridge", "cards", "deal"]
categories = ["games"]
exclude = ["/docs", "/scripts", "/.github"]

# No runtime dependencies, deliberately. An index goes in and thirteen bytes
# come out; anything else would be someone else's opinion travelling with it.
[dependencies]

[dev-dependencies]
serde_json = "1"
sha2 = "0.10"
hex = "0.4"

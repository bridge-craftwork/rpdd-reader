[package]
name = "rpdd-reader"
version = "0.1.0"
edition = "2021"
description = "Reads Richard Pavlicek's public library of 10,485,760 solved bridge deals: deals by index, with their double-dummy tables"
repository = "https://github.com/bridge-craftwork/rpdd-reader"
license = "Unlicense"
keywords = ["bridge", "cards", "deal"]
categories = ["games"]
exclude = ["/docs", "/scripts", "/.github"]

# The generator stays dependency-free — `src/deals.rs` reaches for nothing but
# the standard library, so the unranking travels with no opinions attached. The
# layers above it are a different matter and say so here rather than quietly:
#
#   pairing  needs the .zrd/.zdd record formats, which bridge-encodings owns.
#            Reimplementing ten bytes of table would be a second definition of
#            a published format, and the two would drift.
#   chunks   needs to read a manifest, which is JSON. Feature-gated, because a
#            caller with the whole file on disk has nothing to fetch and should
#            not carry a JSON parser to unrank a deal.
[dependencies]
bridge-encodings = { git = "https://github.com/bridge-craftwork/bridge-encodings" }

serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }

[features]
default = []
# The fetch protocol: which piece of a library holds deal N, and the ask/supply
# loop that gets it. See src/chunks.rs.
chunks = ["dep:serde", "dep:serde_json"]

[dev-dependencies]
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
